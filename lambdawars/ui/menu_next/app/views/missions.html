<section class="content-full content-menu" id="content-missions">
	<main class="rounded nobg">
		<!-- Animated Mission Selector -->
		<div class="mission-carousel-wrapper">
			<div id="mission_wrap_name" class="textStyle">
				{{ mapname }}
			</div>

			<div class="mission-carousel">
				<div class="mission-item"
					ng-class="{'active': $index === currentIndex, 'incoming': $index === (currentIndex + 1), 'passed': $index < currentIndex}"
					ng-repeat="mission in missions track by $index">
					<img ng-src="{{ mission.image }}"/>
				</div>
			</div>
			<button class="carousel-nav prev" ng-click="prevMission()">‹</button>
			<button class="carousel-nav next" ng-click="nextMission()">›</button>
		</div>

		<div id="mission_wrap_description" class="textStyleNav2" ng-bind-html-unsafe="description">
			<h2>{{ 'Mission_Desc' | translate }}</h2>
			<p><span ng-bind-html="description"></span></p>
		</div>

		<div class="actions">
			<select class="select-style action" ng-model="selectedDifficulty">
				<option value="easy">{{ 'Mission_Easy' | translate }}</option>
				<option value="normal">{{ 'Mission_Normal' | translate }}</option>
				<option value="hard">{{ 'Mission_Hard' | translate }}</option>
			</select>
			<a href class="btn btn-highlight action" ng-click="launch_mission()">{{ 'Mission_Launch' | translate }}</a>
		</div>


	</main>
</section>
